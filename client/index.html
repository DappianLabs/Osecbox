<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=yes" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#070709" />

    <meta property="og:title" content="OsecBox - All Your Pentesting Tools In One Interface" />
    <meta property="og:description" content="A modern, IDE-style interface for penetration testing with Nmap, Nikto, Nuclei, DirBuster, Metasploit and AI assistance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OsecBox - All Your Pentesting Tools In One Interface" />
    <meta name="twitter:description" content="A modern, IDE-style interface for penetration testing with Nmap, Nikto, Nuclei, DirBuster, Metasploit and AI assistance." />
    <meta name="twitter:image" content="./opengraph.jpg" />

    <!-- Use system fonts so the desktop app has no external font dependency. -->
    <style>
      /* Use system fonts instead of loading from Google */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, rgba(129, 73, 255, 0.16), #0f0f14 58%); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Inter', sans-serif; z-index: 9999;">
      <div style="text-align: center;">
        <img src="./osecbox-icon.png" alt="OsecBox" width="96" height="96" style="display: block; margin: 0 auto 20px; border-radius: 24px; box-shadow: 0 0 42px rgba(139, 92, 246, 0.42);" />
        <div style="font-size: 24px; font-weight: 650; letter-spacing: 0.02em; margin-bottom: 16px;">OsecBox</div>
        <div style="font-size: 13px; color: #a7a7b5; margin-bottom: 18px;">Preparing your workspace</div>
        <div style="width: 220px; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 999px; overflow: hidden; margin: 0 auto;">
          <div style="width: 42%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #e9d5ff); animation: loading 1.5s ease-in-out infinite; border-radius: inherit;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
