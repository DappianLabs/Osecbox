name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read


concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Release foundation preflight
        run: npm run release:foundation -- --ci


      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); const tag=process.env.RELEASE_TAG.replace(/^v/,''); if (pkg.version !== tag || lock.version !== tag || lock.packages?.['']?.version !== tag) { console.error('package.json/package-lock.json versions must all match tag '+tag); process.exit(1); }"

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Platform compatibility audit
        run: npm run audit:platform

      - name: Type checks
        run: npm run check && npm run check:electron

      - name: Unit tests
        run: npm test

  build:
    name: Build ${{ matrix.target }} release
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      BUILD_ENCRYPTION_SECRET: ${{ secrets.BUILD_ENCRYPTION_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build encryption secret is configured
        run: node -e "if (!/^[a-fA-F0-9]{64}$/.test(process.env.BUILD_ENCRYPTION_SECRET || '')) { console.error('BUILD_ENCRYPTION_SECRET must be a 64-character hexadecimal CI secret'); process.exit(1); }"

      - name: Platform compatibility audit
        run: npm run audit:platform

      - name: Build, audit, and checksum native Electron artifact
        run: npm run build:production:${{ matrix.target }}
        env:
          # This release intentionally does not use a commercial Authenticode
          # certificate. Disable runner certificate discovery so the result is
          # deterministic and remains unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Confirm Windows artifacts are intentionally unsigned
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath release -File -Filter '*.exe')
          if ($executables.Count -eq 0) {
            throw 'No Windows EXE artifacts were produced for the unsigned release.'
          }
          foreach ($executable in $executables) {
            Write-Host "Publishing without commercial Authenticode signing: $($executable.Name)"
          }

      - name: Refresh Windows updater metadata for final unsigned installer
        if: matrix.target == 'win'
        run: node scripts/diagnostics/refresh-windows-updater-metadata.cjs
      - name: Scan Linux artifacts with ClamAV
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --stdout
          clamscan --recursive --infected --no-summary release

      - name: Scan Windows artifacts with Microsoft Defender
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $mpCmdRun = Get-ChildItem -LiteralPath "$env:ProgramData/Microsoft/Windows Defender/Platform" -Filter MpCmdRun.exe -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if (-not $mpCmdRun) {
            throw 'Microsoft Defender command-line scanner was not found on the Windows runner.'
          }
          & $mpCmdRun.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender signature update failed with exit code $LASTEXITCODE."
          }
          $releasePath = (Resolve-Path release).Path
          & $mpCmdRun.FullName -Scan -ScanType 3 -File $releasePath
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender reported a scan failure or threat with exit code $LASTEXITCODE."
          }

      - name: Generate final release checksums
        run: npm run release:checksums

      - name: Verify final release checksums
        run: npm run release:verify-checksums -- release

      - name: Verify final Windows attestation subjects
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $subjects = @(Get-ChildItem -LiteralPath release -File -Filter '*.exe')
          if ($subjects.Count -eq 0) {
            throw 'No final Windows EXE subjects were found for artifact attestation.'
          }
          foreach ($subject in $subjects) {
            Write-Host "Final Windows attestation subject: $($subject.FullName)"
          }

      - name: Verify final Linux attestation subjects
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t subjects < <(find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \) -print | sort)
          if [ "${#subjects[@]}" -eq 0 ]; then
            echo 'No final Linux distributable subjects were found for artifact attestation.' >&2
            exit 1
          fi
          printf 'Final Linux attestation subject: %s\n' "${subjects[@]}"

      - name: Attest final Windows distributables
        if: matrix.target == 'win'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/release/*.exe

      - name: Attest final Linux distributables
        if: matrix.target == 'linux'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/release/*.AppImage
            ${{ github.workspace }}/release/*.deb
            ${{ github.workspace }}/release/*.tar.gz
      - name: Upload native release directory
        uses: actions/upload-artifact@v4
        with:
          name: osecbox-release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: osecbox-release-win
          path: artifacts/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: osecbox-release-linux
          path: artifacts/linux


      - name: Verify downloaded artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          for target in win linux; do
            test -f "artifacts/$target/SHA256SUMS.txt"
            (
              cd "artifacts/$target"
              sha256sum --check SHA256SUMS.txt
            )
          done

      - name: Collect distributables and generate aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/win/latest.yml
          mkdir -p publish/win publish/linux
          for target in win linux; do
            for file in "artifacts/$target"/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              case "$name" in
                *.exe|*.blockmap|latest*.yml|*.AppImage|*.deb|*.tar.gz)
                  cp "$file" "publish/$target/$name"
                  ;;
              esac
            done
          done
          (
            cd publish
            # GitHub Release assets are flattened when downloaded. Generate
            # the aggregate manifest with the published asset basenames rather
            # than local staging paths such as win/foo.exe.
            for target in win linux; do
              for file in "$target"/*; do
                [ -f "$file" ] || continue
                sha256sum "$file" | sed "s#  $target/#  #"
              done
            done | sort -k2 > SHA256SUMS.txt
          )

      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            publish/win/*
            publish/linux/*
            publish/SHA256SUMS.txt
