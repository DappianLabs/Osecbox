name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    - name: Release foundation preflight
      run: npm run release:foundation -- --ci


    - name: Dependency audit
      run: npm run audit:dependencies

    - name: Platform compatibility audit
      run: npm run audit:platform
    
    - name: Type check
      run: npm run check

    - name: Type check Electron
      run: npm run check:electron

    - name: Electron runtime and native PTY smoke test
      run: npm run test:electron-runtime

    - name: Unit tests with coverage
      run: npm run test:coverage
    
    - name: Build
      run: npm run build
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  build-electron:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: test
    # Do not expose the build secret to untrusted fork PRs. Pull requests run
    # the complete test/type/runtime audit above. Encrypted build artifacts are
    # produced only from the trusted main branch; release signing is enforced
    # separately by the tagged release workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      BUILD_ENCRYPTION_SECRET: ${{ secrets.BUILD_ENCRYPTION_SECRET }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Verify build encryption secret is configured
      run: node -e "if (!/^[a-fA-F0-9]{64}$/.test(process.env.BUILD_ENCRYPTION_SECRET || '')) { console.error('BUILD_ENCRYPTION_SECRET must be a 64-character hexadecimal CI secret'); process.exit(1); }"

    - name: Platform compatibility audit
      run: npm run audit:platform

    - name: Electron runtime and native PTY smoke test
      run: npm run test:electron-runtime

    - name: Build Electron (Linux)
      if: matrix.target == 'linux'
      run: npm run build:electron:linux -- --publish never
    
    - name: Build Electron (Windows)
      if: matrix.target == 'win'
      run: npm run build:electron:win -- --publish never


    - name: Audit packaged artifact
      run: node scripts/diagnostics/packaged-artifact-audit.cjs --target=${{ matrix.target }}

    - name: Generate release checksums
      run: npm run release:checksums

    - name: Verify release checksums
      run: npm run release:verify-checksums -- release
    
    - name: Scan Linux artifacts with ClamAV
      if: matrix.target == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clamav clamav-freshclam
        sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
        sudo freshclam --stdout
        clamscan --recursive --infected --no-summary release

    - name: Scan Windows artifacts with Microsoft Defender
      if: matrix.target == 'win'
      shell: pwsh
      run: |
        $mpCmdRun = Get-ChildItem -LiteralPath "$env:ProgramData/Microsoft/Windows Defender/Platform" -Filter MpCmdRun.exe -Recurse -File -ErrorAction SilentlyContinue |
          Sort-Object LastWriteTime |
          Select-Object -Last 1
        if (-not $mpCmdRun) {
          throw 'Microsoft Defender command-line scanner was not found on the Windows runner.'
        }
        & $mpCmdRun.FullName -SignatureUpdate
        if ($LASTEXITCODE -ne 0) {
          throw "Microsoft Defender signature update failed with exit code $LASTEXITCODE."
        }
        $releasePath = (Resolve-Path release).Path
        & $mpCmdRun.FullName -Scan -ScanType 3 -File $releasePath
        if ($LASTEXITCODE -ne 0) {
          throw "Microsoft Defender reported a scan failure or threat with exit code $LASTEXITCODE."
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: electron-${{ matrix.os }}
        path: release/
        if-no-files-found: error
        retention-days: 14
